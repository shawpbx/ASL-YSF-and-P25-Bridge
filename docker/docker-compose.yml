# Repository: https://github.com/shawpbx/ASL-YSF-and-P25-Bridge
# Dockhand / CasaOS / Portainer ready — pulls prebuilt GHCR image (no local Dockerfile required)
# Replace the placeholder environment variables below with your own callsign, node, and reflector IDs.

networks:
  default:
    external: false
    ipam: {}
    name: YSFReflector

services:
  asl-crossmode-bridge:
    image: ghcr.io/shawpbx/asl-ysf-and-p25-bridge:latest
    container_name: asl-crossmode-bridge
    restart: unless-stopped
    depends_on:
      - p25reflector
      - ysfreflector-with-dashboard
    networks:
      - default
    ports:
      - "3000:3000/tcp"
      - "34001:34001/udp"
      - "34002:34002/udp"
    environment:
      - TZ=UTC
      - NODE_ENV=production
      - PORT=3000
      - REMOTE_ASL_HOST=192.168.1.100
      - ASL_NODE=12345
      - YSF_REFLECTOR=10000
      - YSF_REFLECTOR_NAME=MY-YSF
      - YSF_REFLECTOR_DESCRIPTION=My YSF Reflector
      - P25_REFLECTOR=10100
      - BRIDGE_CALLSIGN=N0CALL
      - BRIDGE_DMR_ID=1234567
    volumes:
      - bridge_config:/opt/bridge/config
      - bridge_logs:/var/log/dvswitch
      - bridge_data:/var/lib/dvswitch
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  p25reflector:
    container_name: P25Reflector-10100
    image: corrosive/docker-p25reflector
    networks:
      - default
    ports:
      - "41000:41000/udp"
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - /var/log/P25Reflector:/var/log/P25Reflector

  ysfreflector-with-dashboard:
    container_name: ysfreflector-with-dashboard
    image: ghcr.io/neilbartley/ysfreflector-with-dashboard:latest
    environment:
      REFLECTOR_DESCRIPTION: My YSF Reflector
      REFLECTOR_NAME: MY-YSF
    networks:
      - default
    ports:
      - mode: ingress
        protocol: udp
        published: "42000"
        target: 42000
      - mode: ingress
        protocol: tcp
        published: "42080"
        target: 80
    restart: unless-stopped
    volumes: []

volumes:
  bridge_config:
  bridge_logs:
  bridge_data:

x-casaos:
  is_uncontrolled: false
  main: ysfreflector-with-dashboard
  port_map: "42080"
  store_app_id: upbeat_kurt
  title:
    custom: YSFReflector
